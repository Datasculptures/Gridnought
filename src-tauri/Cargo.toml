[package]
name = "wirezone"
version = "0.1.0"
description = "WIREZONE — wireframe tank combat"
authors = ["Sean"]
edition = "2021"

[lib]
name = "wirezone_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
